
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#4f46e5,#7c3aed,#06b6d4);
}

.login-box{
    width:350px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

.login-box input:focus{
    border-color:#4f46e5;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    margin:15px 0;
}

.options a{
    text-decoration:none;
    color:#4f46e5;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4f46e5;
    color:#fff;
    font-size:17px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#372aac;
}

p{
    text-align:center;
    margin-top:20px;
}

p a{
    text-decoration:none;
    color:#4f46e5;
    font-weight:bold;
}
</style>
<body>

    <div class="login-box">

        <h2>Login</h2>

        <form>

            <input type="email" placeholder="Enter Email" required>

            <input type="password" placeholder="Enter Password" required>

            <div class="options">   
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>

            <p>
                Don't have an account?
                <a href="#">Sign Up</a>
            </p>

        </form>

    </div>

</body>
</html>
